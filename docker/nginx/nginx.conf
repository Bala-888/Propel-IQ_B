# UPACIP — Nginx virtual host configuration
#
# Port 80:  HTTP → HTTPS permanent redirect (AC-003)
# Port 443: TLS termination, SPA static serving, API reverse proxy (AC-005)
#
# TLS: Mozilla intermediate profile (TLSv1.2 + TLSv1.3, NFR-005, TR-008)
# NOTE: dev cert is self-signed; replace ssl_certificate paths in production.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Permanent redirect — no other location blocks on port 80 (AC-003)
    return 301 https://$host$request_uri;
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # TLS certificates (generated at image build time via openssl)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # TLS settings — AC-002; OWASP A02
    # Protocols: TLSv1.0 and TLSv1.1 are explicitly absent (AC-002).
    ssl_protocols             TLSv1.2 TLSv1.3;
    # Ciphers: ECDHE-only AES-256-GCM + ChaCha20 suite; RC4, 3DES, DHE, and AES-128
    # suites are excluded to prevent downgrade to weaker primitives (AC-002; OWASP A02).
    ssl_ciphers               'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    # on: server cipher order is authoritative — clients cannot negotiate down (AC-002).
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers
    # HSTS: preload enables browser-level HTTPS enforcement before the first request;
    # always ensures the header is sent on 4xx/5xx responses (Edge: HSTS; OWASP A05).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    # CSP: upgrade-insecure-requests rewrites any http:// SPA resource requests to https://
    # before they are sent, preventing mixed-content downgrade (Edge: mixed-content SPA; OWASP A05).
    add_header Content-Security-Policy   "default-src 'self'; upgrade-insecure-requests;" always;

    # React SPA static files root
    root  /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # Trailing slash on proxy_pass strips the /api/ prefix before forwarding:
    # https://localhost/api/health  →  http://api:8080/health  (AC-002)
    location /api/ {
        proxy_pass            http://api:8080/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── Hashed static assets — long-term immutable caching ───────────────────
    # Matches Vite-generated filenames containing a content hash (e.g. main.a1b2c3.js)
    location ~* \.(js|css|woff2|woff|ttf|eot|svg|png|jpe?g|gif|ico|webp|map)$ {
        add_header Cache-Control "max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── React Router SPA catch-all ────────────────────────────────────────────
    # Any unmatched path returns index.html so client-side routing works (AC-005)
    # index.html must never be cached — browser must re-fetch on each deployment
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        no-cache;
        add_header Expires       0;
        try_files $uri $uri/ /index.html;
    }
}
