<!DOCTYPE html>
<html lang="en">
<head>
<!-- Navigation Map
| Element              | Action | Target Screen                                         |
|----------------------|--------|-------------------------------------------------------|
| save-btn             | click  | wireframe-SCR-017-admin-user-management.html          |
| cancel-btn           | click  | wireframe-SCR-017-admin-user-management.html          |
UCR: UXR-202 (focus trap), UXR-601 (inline validation)
UC: UC-006
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD-006 — Create / Edit User | UPACIP Hi-Fi Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#1A56DB;--color-primary-hover:#1547B4;--color-primary-subtle:#EBF3FE;--color-text-primary:#0F172A;--color-text-secondary:#475569;--color-text-inverse:#FFFFFF;--color-bg-surface:#FFFFFF;--color-bg-subtle:#F1F5F9;--color-bg-overlay:rgba(15,23,42,0.48);--color-border:#E2E8F0;--color-border-strong:#94A3B8;--color-border-focus:#1A56DB;--color-status-error:#DC2626;--font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-xs:2px;--radius-sm:4px;--radius-md:8px;--shadow-3:0 8px 24px rgba(15,23,42,0.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg-page{position:fixed;inset:0;background:#F8FAFC;z-index:0;display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-size:14px;}
.overlay{position:fixed;inset:0;background:var(--color-bg-overlay);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--color-bg-surface);border-radius:var(--radius-md);padding:var(--space-8);box-shadow:var(--shadow-3);max-width:520px;width:90%;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-6);}
.modal-title{font-size:20px;font-weight:700;}
.close-btn{background:none;border:none;cursor:pointer;font-size:20px;color:#94A3B8;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-xs);}
.close-btn:hover{background:var(--color-bg-subtle);}
.close-btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);}
.form-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-5);}
.form-label{font-size:14px;font-weight:500;}
.form-input,.form-select{font-family:var(--font-sans);font-size:15px;padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text-primary);outline:none;transition:border-color 0.15s;width:100%;}
.form-input:focus,.form-select:focus{border-color:var(--color-border-focus);box-shadow:0 0 0 3px rgba(26,86,219,0.18);}
.form-input.error{border-color:var(--color-status-error);}
.field-error{font-size:12px;color:var(--color-status-error);margin-top:4px;}
/* ACTIVE TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) 0;margin-bottom:var(--space-6);}
.toggle-info .toggle-label{font-size:14px;font-weight:500;margin-bottom:4px;}
.toggle-info .toggle-desc{font-size:13px;color:var(--color-text-secondary);}
.toggle-switch{position:relative;width:44px;height:24px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--color-border-strong);border-radius:9999px;cursor:pointer;transition:background 0.2s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:transform 0.2s;}
input:checked + .toggle-slider{background:var(--color-primary);}
input:checked + .toggle-slider::before{transform:translateX(20px);}
.toggle-switch:focus-within .toggle-slider{outline:2px solid var(--color-border-focus);outline-offset:2px;}
/* BUTTONS */
.modal-actions{display:flex;gap:var(--space-3);justify-content:flex-end;}
.btn{font-family:var(--font-sans);font-size:14px;font-weight:600;padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);min-height:44px;transition:background 0.15s;}
.btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:var(--color-bg-surface);color:var(--color-text-primary);border:1px solid var(--color-border);}
.btn-secondary:hover{background:var(--color-bg-subtle);}
@media(max-width:500px){.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="bg-page" aria-hidden="true">[ Admin user management in background ]</div>

<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-header">
      <h1 class="modal-title" id="modal-title">Edit user — Rebecca Nguyen</h1>
      <a href="wireframe-SCR-017-admin-user-management.html" class="close-btn" aria-label="Cancel and close">×</a>
    </div>

    <form novalidate onsubmit="return saveUser(event)">
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="edit-first">First name</label>
          <input id="edit-first" type="text" class="form-input" value="Rebecca" required autofocus>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="edit-last">Last name</label>
          <input id="edit-last" type="text" class="form-input" value="Nguyen" required>
        </div>
      </div>
      <div style="margin-top:var(--space-5);" class="form-group">
        <label class="form-label" for="edit-email">Email address</label>
        <input id="edit-email" type="email" class="form-input" value="r.nguyen@clinic.com" required aria-describedby="email-hint">
        <span id="email-hint" style="font-size:12px;color:var(--color-text-secondary);">Used for login. Must be unique.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-role">Role</label>
        <select id="edit-role" class="form-select" required aria-label="User role">
          <option value="patient">Patient</option>
          <option value="staff" selected>Staff</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <!-- ACTIVE TOGGLE -->
      <div class="toggle-row" role="group" aria-label="Account active status">
        <div class="toggle-info">
          <div class="toggle-label">Account active</div>
          <div class="toggle-desc">Inactive users cannot log in.</div>
        </div>
        <label class="toggle-switch" aria-label="Toggle account active status">
          <input type="checkbox" checked aria-checked="true">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- INLINE ERROR (validation example) -->
      <div id="form-error" class="field-error" role="alert" style="margin-bottom:var(--space-5);display:none;"></div>

      <div class="modal-actions">
        <a href="wireframe-SCR-017-admin-user-management.html" id="cancel-btn" class="btn btn-secondary">Cancel</a>
        <button type="submit" id="save-btn" class="btn btn-primary">Save user</button>
      </div>
    </form>
  </div>
</div>

<script>
function saveUser(e){
  e.preventDefault();
  var first=document.getElementById('edit-first').value.trim();
  var email=document.getElementById('edit-email').value.trim();
  var errEl=document.getElementById('form-error');
  if(!first||!email||!email.includes('@')){
    errEl.style.display='block';
    errEl.textContent='Please fill in all required fields with valid values.';
    return false;
  }
  errEl.style.display='none';
  window.location.href='wireframe-SCR-017-admin-user-management.html';
}
document.querySelector('.overlay').addEventListener('keydown',function(e){
  if(e.key==='Escape') window.location.href='wireframe-SCR-017-admin-user-management.html';
  if(e.key==='Tab'){
    var focusable=this.querySelectorAll('button,a,input,select,textarea,[tabindex]:not([tabindex="-1"])');
    var first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
    else{if(document.activeElement===last){e.preventDefault();first.focus();}}
  }
});
</script>
</body>
</html>
