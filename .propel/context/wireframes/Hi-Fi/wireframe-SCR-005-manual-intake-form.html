<!DOCTYPE html>
<html lang="en">
<head>
<!-- Navigation Map
| Element             | Action | Target Screen                                     |
|---------------------|--------|---------------------------------------------------|
| switch-ai-link      | click  | wireframe-SCR-004-ai-conversational-intake.html   |
| submit-intake-btn   | submit | wireframe-SCR-003-patient-home-dashboard.html     |
| nav links           | click  | respective screens                                |
UCR: UXR-103 (data preservation), UXR-202 (keyboard nav), UXR-204 (labels), UXR-601 (inline errors)
UC: UC-008, UC-009, UC-010
Flows: FL-004 (steps 2-3)
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCR-005 — Manual Intake Form | UPACIP Hi-Fi Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#1A56DB;--color-primary-hover:#1547B4;--color-primary-subtle:#EBF3FE;--color-text-primary:#0F172A;--color-text-secondary:#475569;--color-text-disabled:#94A3B8;--color-text-inverse:#FFFFFF;--color-bg-page:#F8FAFC;--color-bg-surface:#FFFFFF;--color-bg-subtle:#F1F5F9;--color-border:#E2E8F0;--color-border-strong:#94A3B8;--color-border-focus:#1A56DB;--color-status-success:#16A34A;--color-status-error:#DC2626;--font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-xs:2px;--radius-sm:4px;--radius-md:8px;--shadow-1:0 1px 3px rgba(15,23,42,0.08);--sidebar-width:240px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-bg-page);color:var(--color-text-primary);height:100vh;display:flex;overflow:hidden;}
.sidebar{width:var(--sidebar-width);min-height:100vh;background:var(--color-bg-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-logo{padding:var(--space-6);font-size:18px;font-weight:700;color:var(--color-primary);border-bottom:1px solid var(--color-border);}
.sidebar-nav{flex:1;padding:var(--space-4) var(--space-3);}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--color-text-secondary);text-decoration:none;transition:background 0.1s;min-height:44px;margin-bottom:var(--space-1);}
.nav-item:hover{background:var(--color-bg-subtle);}
.nav-item.active{background:var(--color-primary-subtle);color:var(--color-primary);}
.nav-item:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.sidebar-footer{padding:var(--space-4) var(--space-3);border-top:1px solid var(--color-border);}
.user-info{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--color-primary-subtle);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.app-header{height:56px;background:var(--color-bg-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);}
.header-title{font-size:16px;font-weight:600;}
.content-area{flex:1;overflow-y:auto;padding:var(--space-10);}
/* TABS */
.tabs-bar{display:flex;border-bottom:2px solid var(--color-border);margin-bottom:var(--space-8);gap:0;}
.tab{padding:var(--space-3) var(--space-5);font-size:14px;font-weight:500;color:var(--color-text-secondary);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.15s;min-height:44px;}
.tab:hover{color:var(--color-text-primary);}
.tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary);}
.tab.complete{color:var(--color-status-success);}
.tab:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
/* SAVE STATUS */
.save-status{font-size:13px;color:var(--color-text-secondary);display:flex;align-items:center;gap:var(--space-2);}
/* FORM */
.form-max{max-width:640px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-5);}
.form-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-5);}
.form-label{font-size:14px;font-weight:500;}.required{color:var(--color-status-error);margin-left:2px;}
.form-input,.form-select,.form-textarea{font-family:var(--font-sans);font-size:15px;padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-bg-surface);color:var(--color-text-primary);outline:none;transition:border-color 0.15s,box-shadow 0.15s;width:100%;}
.form-textarea{resize:vertical;min-height:96px;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--color-border-focus);box-shadow:0 0 0 3px rgba(26,86,219,0.18);}
.form-input:hover,.form-select:hover,.form-textarea:hover{border-color:var(--color-border-strong);}
.form-input.error{border-color:var(--color-status-error);}
.inline-error{font-size:13px;color:var(--color-status-error);display:flex;align-items:center;gap:4px;margin-top:var(--space-1);}
.helper-text{font-size:12px;color:var(--color-text-secondary);}
/* SECTION DIVIDER */
.section-divider{border:none;border-top:1px solid var(--color-border);margin:var(--space-8) 0;}
.section-title{font-size:15px;font-weight:600;margin-bottom:var(--space-5);}
/* BUTTONS */
.btn{font-family:var(--font-sans);font-size:14px;font-weight:600;padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);transition:background 0.15s;min-height:44px;min-width:44px;}
.btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:var(--color-bg-surface);color:var(--color-text-primary);border:1px solid var(--color-border);}
.btn-secondary:hover{background:var(--color-bg-subtle);}
.btn-ghost{background:transparent;color:var(--color-text-secondary);border:1px solid var(--color-border);}
.btn-ghost:hover{background:var(--color-bg-subtle);}
.form-footer{display:flex;justify-content:space-between;align-items:center;padding-top:var(--space-8);border-top:1px solid var(--color-border);margin-top:var(--space-8);}
/* Tab complete indicator */
.tab-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--color-status-success);color:white;font-size:9px;font-weight:700;margin-left:4px;}
@media(max-width:1279px){.sidebar{display:none;}.content-area{padding:var(--space-8);}}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}.content-area{padding:var(--space-5);}}
</style>
</head>
<body>
<aside class="sidebar" role="navigation" aria-label="Patient navigation">
  <div class="sidebar-logo">UPACIP</div>
  <nav class="sidebar-nav">
    <a href="wireframe-SCR-003-patient-home-dashboard.html" class="nav-item">Dashboard</a>
    <a href="wireframe-SCR-004-ai-conversational-intake.html" class="nav-item active" aria-current="page">Intake</a>
    <a href="wireframe-SCR-006-appointment-slot-calendar.html" class="nav-item">Appointments</a>
    <a href="wireframe-SCR-009-document-upload.html" class="nav-item">Documents</a>
    <a href="wireframe-SCR-008-patient-profile-settings.html" class="nav-item">Profile</a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="avatar">SM</div>
      <div><div style="font-size:14px;font-weight:500;">Sarah Mitchell</div><div style="font-size:12px;color:var(--color-text-secondary);">Patient</div></div>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <header class="app-header">
    <div class="header-title">Manual intake form</div>
    <a href="wireframe-SCR-004-ai-conversational-intake.html" id="switch-ai-link" class="btn btn-secondary" style="font-size:13px;padding:8px 16px;height:auto;">Switch to AI mode</a>
  </header>

  <main class="content-area" id="main-content">
    <!-- TABS (UXR — section completion) -->
    <div class="tabs-bar" role="tablist" aria-label="Intake form sections">
      <button class="tab complete" role="tab" aria-selected="false" aria-controls="demographics-panel" onclick="switchTab(0)">Demographics <span class="tab-badge" aria-label="Complete">✓</span></button>
      <button class="tab active" role="tab" aria-selected="true" aria-controls="history-panel" onclick="switchTab(1)">Medical history</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="meds-panel" onclick="switchTab(2)">Medications</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="allergies-panel" onclick="switchTab(3)">Allergies</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="complaint-panel" onclick="switchTab(4)">Chief complaint</button>
    </div>

    <!-- AUTO-SAVE STATUS (UXR) -->
    <div class="save-status" aria-live="polite" style="margin-bottom:var(--space-6);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      Saved · 17 May 2026, 10:14 AM
    </div>

    <!-- ACTIVE TAB: Medical History -->
    <div id="history-panel" role="tabpanel" aria-labelledby="history-tab" class="form-max">
      <div class="section-title">Medical history</div>

      <div class="form-group">
        <label class="form-label" for="conditions">Existing conditions <span class="required" aria-hidden="true">*</span></label>
        <textarea id="conditions" class="form-textarea" aria-required="true" placeholder="List any diagnosed conditions (e.g., hypertension, type 2 diabetes, asthma)" aria-describedby="conditions-hint">Community-acquired pneumonia (diagnosed Mar 2026); Iron-deficiency anaemia (diagnosed Apr 2026)</textarea>
        <span id="conditions-hint" class="helper-text">Separate multiple conditions with semicolons.</span>
        <span class="inline-error" role="alert" style="display:none;">This field is required.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="surgeries">Previous surgeries or procedures</label>
        <textarea id="surgeries" class="form-textarea" placeholder="List any previous surgeries or significant procedures (optional)">Appendectomy (2017)</textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="family-history">Family history</label>
        <textarea id="family-history" class="form-textarea" placeholder="Relevant family medical history (optional)">Father: coronary artery disease (onset age 52). Mother: type 2 diabetes.</textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="smoking">Smoking status <span class="required" aria-hidden="true">*</span></label>
        <select id="smoking" class="form-select" aria-required="true">
          <option value="">Select…</option>
          <option selected>Never smoked</option>
          <option>Former smoker</option>
          <option>Current smoker</option>
          <option>E-cigarette/vaping</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="alcohol">Alcohol use</label>
          <select id="alcohol" class="form-select">
            <option>Occasional (1–2 drinks/week)</option>
            <option>Moderate</option>
            <option>Heavy</option>
            <option selected>None</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="exercise">Exercise frequency</label>
          <select id="exercise" class="form-select">
            <option>Daily</option>
            <option selected>3–4× per week</option>
            <option>1–2× per week</option>
            <option>Rarely</option>
            <option>None</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button class="btn btn-ghost" onclick="switchTab(0)">← Previous</button>
      <button class="btn btn-primary" id="submit-intake-btn" onclick="nextTab(event)">Next: Medications →</button>
    </div>
  </main>
</div>

<script>
var tabs = document.querySelectorAll('.tab');
function switchTab(i){tabs.forEach(function(t,j){t.classList.toggle('active',i===j);t.setAttribute('aria-selected',i===j);});}
function nextTab(e){e.preventDefault();switchTab(2);}
</script>
</body>
</html>
