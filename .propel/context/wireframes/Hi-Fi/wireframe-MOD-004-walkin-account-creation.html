<!DOCTYPE html>
<html lang="en">
<head>
<!-- Navigation Map
| Element              | Action | Target Screen                                         |
|----------------------|--------|-------------------------------------------------------|
| skip-btn             | click  | wireframe-SCR-011-staff-queue-dashboard.html          |
| create-btn           | click  | wireframe-SCR-011-staff-queue-dashboard.html          |
UCR: UXR-601 (inline validation), UXR-202 (focus trap)
UC: UC-002 (optional account creation during walk-in)
Note: This modal is embedded inline as an optional section in SCR-012; presented as standalone for demo.
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD-004 — Walk-in Account Creation | UPACIP Hi-Fi Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#1A56DB;--color-primary-hover:#1547B4;--color-primary-subtle:#EBF3FE;--color-text-primary:#0F172A;--color-text-secondary:#475569;--color-text-inverse:#FFFFFF;--color-bg-surface:#FFFFFF;--color-bg-subtle:#F1F5F9;--color-bg-overlay:rgba(15,23,42,0.48);--color-border:#E2E8F0;--color-border-strong:#94A3B8;--color-border-focus:#1A56DB;--color-status-success:#16A34A;--color-status-error:#DC2626;--font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:4px;--radius-md:8px;--shadow-3:0 8px 24px rgba(15,23,42,0.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg-page{position:fixed;inset:0;background:#F8FAFC;z-index:0;display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-size:14px;}
.overlay{position:fixed;inset:0;background:var(--color-bg-overlay);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{background:var(--color-bg-surface);border-radius:var(--radius-md);padding:var(--space-8);box-shadow:var(--shadow-3);max-width:440px;width:90%;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-2);}
.modal-title{font-size:20px;font-weight:700;}
.modal-sub{font-size:14px;color:var(--color-text-secondary);margin-bottom:var(--space-6);}
.close-btn{background:none;border:none;cursor:pointer;font-size:20px;color:#94A3B8;min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);}
.close-btn:hover{background:var(--color-bg-subtle);}
.close-btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.optional-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--color-text-secondary);background:var(--color-bg-subtle);border:1px solid var(--color-border);padding:2px 8px;border-radius:9999px;margin-bottom:var(--space-4);}
/* FORM */
.form-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-5);}
.form-label{font-size:14px;font-weight:500;}
.form-input{font-family:var(--font-sans);font-size:15px;padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-sm);outline:none;transition:border-color 0.15s;width:100%;}
.form-input:focus{border-color:var(--color-border-focus);box-shadow:0 0 0 3px rgba(26,86,219,0.18);}
.field-hint{font-size:12px;color:var(--color-text-secondary);margin-top:4px;}
.field-error{font-size:12px;color:var(--color-status-error);margin-top:4px;}
/* BUTTONS */
.btn{font-family:var(--font-sans);font-size:15px;font-weight:600;padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:48px;transition:background 0.15s;width:100%;margin-bottom:var(--space-3);}
.btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:var(--color-bg-surface);color:var(--color-text-primary);border:1px solid var(--color-border);}
.btn-secondary:hover{background:var(--color-bg-subtle);}
.divider-or{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-4) 0;font-size:13px;color:var(--color-text-secondary);}
.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--color-border);}
</style>
</head>
<body>
<div class="bg-page" aria-hidden="true">[ Walk-in booking form in background ]</div>

<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-sub">
  <div class="modal">
    <div class="modal-header">
      <h1 class="modal-title" id="modal-title">Create patient account</h1>
      <a href="wireframe-SCR-011-staff-queue-dashboard.html" class="close-btn" aria-label="Skip and return to queue">×</a>
    </div>
    <p class="modal-sub" id="modal-sub">Optionally create a portal account so the patient can manage their appointments online.</p>
    <div class="optional-badge">Optional — can be done later</div>

    <div class="form-group">
      <label class="form-label" for="acc-email">Email address</label>
      <input id="acc-email" type="email" class="form-input" placeholder="patient@example.com" autofocus>
    </div>

    <div class="form-group" style="margin-bottom:var(--space-3);">
      <label class="form-label" for="acc-password">Temporary password</label>
      <input id="acc-password" type="password" class="form-input" placeholder="Minimum 8 characters">
      <span class="field-hint">Patient will be prompted to change this on first login.</span>
    </div>

    <button class="btn btn-primary" onclick="createAccount()" id="create-btn">Create account and add to queue</button>

    <div class="divider-or">or</div>

    <a href="wireframe-SCR-011-staff-queue-dashboard.html" id="skip-btn" class="btn btn-secondary">Skip account creation — add to queue</a>
  </div>
</div>

<script>
function createAccount(){
  var email=document.getElementById('acc-email').value.trim();
  if(!email || !email.includes('@')){
    document.getElementById('acc-email').style.borderColor='var(--color-status-error)';
    document.getElementById('acc-email').setAttribute('aria-invalid','true');
    return;
  }
  window.location.href='wireframe-SCR-011-staff-queue-dashboard.html';
}
</script>
</body>
</html>
