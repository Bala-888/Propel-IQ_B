<!DOCTYPE html>
<html lang="en">
<head>
<!-- Navigation Map
| Element              | Action | Target Screen                                         |
|----------------------|--------|-------------------------------------------------------|
| stay-signed-in-btn   | click  | Action placeholder (resets session timer)             |
| sign-out-btn         | click  | wireframe-SCR-001-login.html                          |
UCR: UXR-202 (focus trap), UXR-203 (keyboard accessible), MOD-001
UC: UC-005
Flows: FL-003 (session timeout)
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD-001 — Session Timeout Warning | UPACIP Hi-Fi Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--color-primary:#1A56DB;--color-primary-hover:#1547B4;--color-text-primary:#0F172A;--color-text-secondary:#475569;--color-text-inverse:#FFFFFF;--color-bg-surface:#FFFFFF;--color-bg-overlay:rgba(15,23,42,0.48);--color-border:#E2E8F0;--color-border-focus:#1A56DB;--color-status-warning:#D97706;--font-sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;--font-mono:'IBM Plex Mono','Courier New',monospace;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-sm:4px;--radius-md:8px;--shadow-3:0 8px 24px rgba(15,23,42,0.14);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;}
/* ILLUSTRATIVE BACKGROUND CONTENT */
.bg-page{position:fixed;inset:0;background:#F8FAFC;z-index:0;display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-size:14px;}
/* OVERLAY (UXR-202: focus trap) */
.overlay{position:fixed;inset:0;background:var(--color-bg-overlay);display:flex;align-items:center;justify-content:center;z-index:100;}
/* MODAL */
.modal{background:var(--color-bg-surface);border-radius:var(--radius-md);padding:var(--space-10);box-shadow:var(--shadow-3);max-width:420px;width:90%;text-align:center;}
.modal-icon{width:56px;height:56px;border-radius:50%;background:#FEF3C7;display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-6);}
.modal-title{font-size:22px;font-weight:700;margin-bottom:var(--space-3);}
.modal-body{font-size:15px;color:var(--color-text-secondary);margin-bottom:var(--space-6);}
/* COUNTDOWN TIMER */
.timer{font-family:var(--font-mono);font-size:48px;font-weight:400;color:var(--color-status-warning);margin:var(--space-6) 0;letter-spacing:2px;line-height:1;}
.timer-label{font-size:13px;color:var(--color-text-secondary);margin-bottom:var(--space-8);}
/* BUTTONS */
.btn{font-family:var(--font-sans);font-size:15px;font-weight:600;padding:var(--space-3) var(--space-5);border-radius:var(--radius-sm);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;transition:background 0.15s;width:100%;justify-content:center;margin-bottom:var(--space-3);}
.btn:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:var(--color-bg-surface);color:var(--color-text-primary);border:1px solid var(--color-border);}
.btn-secondary:hover{background:#F1F5F9;}
</style>
</head>
<body>
<div class="bg-page" aria-hidden="true">[ Authenticated screen in background ]</div>

<!-- SESSION TIMEOUT MODAL (UXR-202: focus trap, UXR-203: keyboard accessible) -->
<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="session-title" aria-describedby="session-desc" id="session-modal">
  <div class="modal">
    <div class="modal-icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <h1 class="modal-title" id="session-title">Your session is about to expire</h1>
    <p class="modal-body" id="session-desc">For your security, you will be automatically signed out in</p>
    <div class="timer" role="timer" aria-label="Time remaining before session expires" id="countdown">13:00</div>
    <!-- Screen reader announcements at key thresholds only (HIGH-002: avoid flooding SR with every-second updates) -->
    <div id="timer-announce" aria-live="polite" aria-atomic="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;"></div>
    <div class="timer-label">minutes remaining</div>
    <button class="btn btn-primary" id="stay-signed-in-btn" onclick="resetTimer()" autofocus>Stay signed in</button>
    <a href="wireframe-SCR-001-login.html" class="btn btn-secondary" id="sign-out-btn">Sign out now</a>
    <p style="font-size:12px;color:#94A3B8;margin-top:var(--space-5);">Your work is saved. You can sign back in at any time.</p>
  </div>
</div>

<script>
// Wireframe demo: countdown from 13:00
var seconds = 13 * 60;
var announceAt = [300, 120, 60, 30]; // seconds at which to announce to screen readers
function formatTime(s){ var m=Math.floor(s/60); var sec=s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }
var countdownEl = document.getElementById('countdown');
var announceEl = document.getElementById('timer-announce');
var interval = setInterval(function(){
  seconds--;
  if(seconds < 0){ clearInterval(interval); window.location.href='wireframe-SCR-001-login.html'; return; }
  countdownEl.textContent = formatTime(seconds);
  if(seconds <= 60) countdownEl.style.color = '#DC2626';
  // HIGH-002 fix: announce only at key thresholds, not every second
  if(announceAt.includes(seconds)){
    var mins = Math.ceil(seconds / 60);
    announceEl.textContent = mins > 1 ? 'Session expires in ' + mins + ' minutes' : 'Session expires in less than 1 minute';
  }
}, 1000);
function resetTimer(){
  clearInterval(interval);
  document.getElementById('session-modal').style.display='none';
  seconds = 13 * 60;
  countdownEl.textContent = formatTime(seconds);
  countdownEl.style.color = '#D97706';
  // In production: POST /api/session/refresh
}
// UXR-202 Focus trap: keep focus within modal
document.getElementById('session-modal').addEventListener('keydown', function(e){
  if(e.key==='Tab'){
    var focusable=this.querySelectorAll('button,a,[tabindex]:not([tabindex="-1"])');
    var first=focusable[0], last=focusable[focusable.length-1];
    if(e.shiftKey){ if(document.activeElement===first){e.preventDefault();last.focus();} }
    else { if(document.activeElement===last){e.preventDefault();first.focus();} }
  }
});
</script>
</body>
</html>
