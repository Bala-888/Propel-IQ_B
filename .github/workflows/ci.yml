name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24.x'

jobs:
  # ─── .NET API ─────────────────────────────────────────────────────────────
  api-build-test:
    name: API — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api

    services:
      postgres:
        # pgvector/pgvector includes pgvector extension alongside PostgreSQL
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: upacip_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=upacip_test;Username=test_user;Password=test_password"
      Jwt__Key: "ci_test_secret_key_minimum_32_characters_long_placeholder"
      Jwt__Issuer: "upacip"
      Jwt__Audience: "upacip-users"
      # "ci-test-key-upacip-32-bytes-long" = exactly 32 ASCII bytes
      Phi__EncryptionKey: "Y2ktdGVzdC1rZXktdXBhY2lwLTMyLWJ5dGVzLWxvbmc="
      Seq__ServerUrl: "http://localhost:5341"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version 9.0.4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Apply migrations
        run: dotnet ef database update --no-build -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: '**/test-results.trx'
          reporter: dotnet-trx

  # ─── React SPA ────────────────────────────────────────────────────────────
  client-build-test:
    name: Client — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc -- --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run
        continue-on-error: true  # No tests in early sprints

  # ─── Docker build validation ──────────────────────────────────────────────
  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet
